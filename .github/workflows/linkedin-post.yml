post:
  needs: detect
  if: needs.detect.outputs.folders != '[]'
  runs-on: ubuntu-latest

  strategy:
    fail-fast: false
    matrix:
      folder: ${{ fromJson(needs.detect.outputs.folders) }}

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Verify solution file exists
      id: check
      run: |
        if ls "${{ matrix.folder }}"/*.py >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No .py solution found in ${{ matrix.folder }}, skipping this folder."
        fi

    - name: Check LinkedIn flag
      id: linkedin_check
      if: steps.check.outputs.exists == 'true'
      run: |
        FILE="${{ matrix.folder }}/post.json"

        if [ ! -f "$FILE" ]; then
          echo "linkedin=false" >> "$GITHUB_OUTPUT"
          echo "::warning::post.json not found."
          exit 0
        fi

        VALUE=$(jq -r '.linkedin // false' "$FILE")

        echo "linkedin=$VALUE" >> "$GITHUB_OUTPUT"

        if [ "$VALUE" != "true" ]; then
          echo "Skipping LinkedIn post"
        fi

    - name: Generate images
      if: steps.check.outputs.exists == 'true' && steps.linkedin_check.outputs.linkedin == 'true'
      run: |
        python scripts/generate_images.py "${{ matrix.folder }}"

    - name: Upload images to Cloudinary
      if: steps.check.outputs.exists == 'true' && steps.linkedin_check.outputs.linkedin == 'true'
      env:
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      run: |
        python scripts/upload_to_cloudinary.py "${{ matrix.folder }}"

    - name: Post to LinkedIn
      if: steps.check.outputs.exists == 'true' && steps.linkedin_check.outputs.linkedin == 'true'
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python scripts/post_to_linkedin.py "${{ matrix.folder }}"
