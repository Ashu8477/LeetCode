name: LinkedIn Automation

on:
  push:
    branches:
      - main

jobs:
  linkedin:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find latest changed folder
        id: folder
        run: |
      
          FOLDER=$(git diff --name-only HEAD~1 HEAD \
            | grep -oE '^[0-9]+-[^/]+' \
            | head -1)
      
          echo "folder=$FOLDER" >> $GITHUB_OUTPUT
      
          echo "Detected folder: $FOLDER"

      - name: Generate images
        run: |
          python scripts/generate_images.py "${{ steps.folder.outputs.folder }}"

      - name: Upload images to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python scripts/upload_to_cloudinary.py "${{ steps.folder.outputs.folder }}"

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: |
          python scripts/post_to_linkedin.py "${{ steps.folder.outputs.folder }}"
