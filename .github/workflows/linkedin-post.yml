name: LinkedIn Automation

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/README.md'
      - '**/post.json'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      folders: ${{ steps.detect.outputs.folders }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed problem folders
        id: detect
        run: |
          FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
          | grep -E '\.py$|README\.md$|post\.json$' \
          | head -n 1)

          echo "Changed file: $FILE"

          if [ -z "$FILE" ]; then
            echo "folders=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FOLDER=$(dirname "$FILE")

          echo "Detected folder: $FOLDER"

          echo "folders=[\"$FOLDER\"]" >> "$GITHUB_OUTPUT"

  post:
    needs: detect
    if: needs.detect.outputs.folders != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        folder: ${{ fromJson(needs.detect.outputs.folders) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Wait for GitHub sync
        run: |
          echo "Waiting for GitHub sync..."
          sleep 30

      - name: Debug commit info
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo "Triggered commit:"
          echo "${{ github.sha }}"

          echo "Folder:"
          echo "${{ matrix.folder }}"

      - name: Debug files
        run: |
          echo "Repository root:"
          ls -la

          echo "Folder contents:"
          ls -la "${{ matrix.folder }}" || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify solution file exists
        id: check
        run: |
          echo "Checking folder: ${{ matrix.folder }}"

          PY_FILE=$(find "${{ matrix.folder }}" -maxdepth 1 -name "*.py" | head -n 1)

          echo "Python file found: $PY_FILE"

          if [ -n "$PY_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No .py solution found in ${{ matrix.folder }}"
          fi

      - name: Check LinkedIn flag
        id: linkedin_check
        if: steps.check.outputs.exists == 'true'
        run: |
          FILE="${{ matrix.folder }}/post.json"

          echo "Reading: $FILE"

          if [ ! -f "$FILE" ]; then
            echo "linkedin=false" >> "$GITHUB_OUTPUT"
            echo "::warning::post.json not found"
            exit 0
          fi

          cat "$FILE"

          VALUE=$(jq -r '.linkedin // false' "$FILE")

          echo "LinkedIn value: $VALUE"

          echo "linkedin=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Generate images
        if: steps.check.outputs.exists == 'true' && steps.linkedin_check.outputs.linkedin == 'true'
        run: |
          echo "Generating images..."
          python scripts/generate_images.py "${{ matrix.folder }}"

      - name: Upload images to Cloudinary
        if: steps.check.outputs.exists == 'true' && steps.linkedin_check.outputs.linkedin == 'true'
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          echo "Uploading images..."
          python scripts/upload_to_cloudinary.py "${{ matrix.folder }}"

      - name: Post to LinkedIn
        if: steps.check.outputs.exists == 'true' && steps.linkedin_check.outputs.linkedin == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Posting to LinkedIn..."
          python scripts/post_to_linkedin.py "${{ matrix.folder }}"
